name: Instagram 카드뉴스 자동 게시

on:
  workflow_run:
    workflows: ["Auto-merge Claude routine branches"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "발행할 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false

permissions:
  contents: write

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.setdate.outputs.date }}
      ready1: ${{ steps.check.outputs.ready1 }}
      ready2: ${{ steps.check.outputs.ready2 }}
      ready3: ${{ steps.check.outputs.ready3 }}
      any_ready: ${{ steps.check.outputs.any_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - id: setdate
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Seoul date +%F)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - id: check
        run: |
          DATE="${{ steps.setdate.outputs.date }}"
          ANY=false
          for i in 1 2 3; do
            if [ -f "docs/${DATE}-cardnews-${i}.html" ]; then
              echo "ready${i}=true" >> "$GITHUB_OUTPUT"
              ANY=true
            else
              echo "ready${i}=false" >> "$GITHUB_OUTPUT"
              echo "docs/${DATE}-cardnews-${i}.html 없음, 세트 ${i} 건너뜀"
            fi
          done
          echo "any_ready=$ANY" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.any_ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - if: steps.check.outputs.any_ready == 'true'
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - if: steps.check.outputs.any_ready == 'true'
        name: 세트별 렌더링, 릴스용 영상 생성, 캡션 확보
        run: |
          DATE="${{ steps.setdate.outputs.date }}"
          READY1="${{ steps.check.outputs.ready1 }}"
          READY2="${{ steps.check.outputs.ready2 }}"
          READY3="${{ steps.check.outputs.ready3 }}"
          for i in 1 2 3; do
            READY_VAR="READY$i"
            if [ "${!READY_VAR}" != "true" ]; then continue; fi
            node scripts/render-for-instagram.js "$DATE" "$i"

            DIR="docs/exports/${DATE}/${i}"
            LIST="$DIR/concat.txt"
            > "$LIST"
            for f in 01-main.jpg 02-cut2.jpg 03-cut3.jpg 04-cut4.jpg 05-cut5.jpg 06-cut6.jpg; do
              echo "file '$(readlink -f "$DIR/$f")'" >> "$LIST"
              echo "duration 5" >> "$LIST"
            done
            echo "file '$(readlink -f "$DIR/06-cut6.jpg")'" >> "$LIST"
            ffmpeg -y -f concat -safe 0 -i "$LIST" \
              -stream_loop -1 -i design/assets/bgm.mp3 \
              -vf "format=yuv420p" -r 30 -c:v libx264 -c:a aac -b:a 128k -shortest -movflags +faststart \
              "$DIR/reel.mp4"
            rm "$LIST"
            echo "- 세트 $i 릴스 영상 생성됨: $DIR/reel.mp4"

            CAPTION_FILE="docs/${DATE}-caption-${i}.txt"
            if [ ! -f "$CAPTION_FILE" ]; then
              TITLE=$(grep -oPm1 "(?<=<title>)[^<]+" "docs/${DATE}-cardnews-${i}.html")
              {
                echo "$TITLE"
                echo ""
                echo "오늘의 경제 카드뉴스"
                echo "#경제뉴스 #오늘의경제 #카드뉴스 #경제공부 #뉴스브리핑"
              } > "$CAPTION_FILE"
              echo "$CAPTION_FILE 없어서 기본 템플릿으로 생성함"
            fi
          done

      - if: steps.check.outputs.any_ready == 'true'
        run: |
          DATE="${{ steps.setdate.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "docs/exports/${DATE}"
          for i in 1 2 3; do
            [ -f "docs/${DATE}-caption-${i}.txt" ] && git add "docs/${DATE}-caption-${i}.txt"
          done
          git commit -m "Instagram 게시용 이미지 렌더링: ${DATE}" || echo "변경 없음"
          git push origin master

  wait-for-pages:
    needs: render
    if: needs.render.outputs.any_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages 반영 대기 및 확인
        run: |
          DATE="${{ needs.render.outputs.date }}"
          READY1="${{ needs.render.outputs.ready1 }}"
          READY2="${{ needs.render.outputs.ready2 }}"
          READY3="${{ needs.render.outputs.ready3 }}"
          for i in 1 2 3; do
            READY_VAR="READY$i"
            if [ "${!READY_VAR}" != "true" ]; then continue; fi
            OK=false
            for attempt in $(seq 1 15); do
              OK=true
              for f in 01-main 02-cut2 03-cut3 04-cut4 05-cut5 06-cut6; do
                URL="https://kkssmm616-gif.github.io/insta-cardnews/exports/$DATE/$i/$f.jpg"
                CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                if [ "$CODE" != "200" ]; then OK=false; fi
              done
              REEL_URL="https://kkssmm616-gif.github.io/insta-cardnews/exports/$DATE/$i/reel.mp4"
              REEL_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$REEL_URL")
              if [ "$REEL_CODE" != "200" ]; then OK=false; fi
              if [ "$OK" = "true" ]; then
                echo "세트 $i 이미지 접근 가능"
                break
              fi
              echo "세트 $i GitHub Pages 반영 대기 중... ($attempt/15)"
              sleep 20
            done
            if [ "$OK" != "true" ]; then
              echo "타임아웃: 세트 $i 이미지가 아직 공개되지 않음"
              exit 1
            fi
          done

  approve-and-publish:
    needs: [render, wait-for-pages]
    if: needs.render.outputs.any_ready == 'true'
    runs-on: ubuntu-latest
    environment: instagram-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 임시 축소 모드 (2026-09-12~): Meta가 이 계정/앱의 게시 요청을 스팸으로
      # 오탐지해 "Application request limit reached"(code 4, subcode 2207051,
      # is_transient:false)로 계속 차단 중. Meta 개발자 커뮤니티에도 동일 증상이
      # 다수 보고돼있고("새 앱+새 계정+비슷한 콘텐츠를 짧은 간격으로 다량 게시"가
      # 전형적인 오탐 패턴), 호출량 절감/시간 분산 둘 다 효과가 없었음.
      # 플래그가 풀렸는지 확인될 때까지 하루 캐러셀 1개만(릴스 없이, 나머지
      # 세트 예약도 없이) 게시하도록 축소. 정상 확인되면 REDUCED_MODE를
      # false로 되돌리면 원래(세트별 캐러셀+릴스, 8시간 간격 예약) 동작으로 복귀.
      - name: 세트 발행 (임시 축소 모드 — 하루 캐러셀 1개만)
        id: publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841429536058936"
          REDUCED_MODE: "true"
        run: |
          DATE="${{ needs.render.outputs.date }}"
          READY1="${{ needs.render.outputs.ready1 }}"
          READY2="${{ needs.render.outputs.ready2 }}"
          READY3="${{ needs.render.outputs.ready3 }}"

          READY_SETS=()
          for i in 1 2 3; do
            READY_VAR="READY$i"
            [ "${!READY_VAR}" = "true" ] && READY_SETS+=("$i")
          done

          FIRST="${READY_SETS[0]}"
          echo "=== 세트 $FIRST 캐러셀만 게시 (축소 모드: 릴스/나머지 세트 생략) ==="
          export DATE="$DATE"
          export SET_INDEX="$FIRST"
          export CAPTION="$(cat "docs/${DATE}-caption-${FIRST}.txt")"
          node scripts/publish-to-instagram.js

          if [ "$REDUCED_MODE" = "true" ]; then
            echo "축소 모드라 릴스 및 나머지 세트는 생략함"
            echo "queued=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/publish-reel-to-instagram.js

          REMAINING=("${READY_SETS[@]:1}")
          if [ "${#REMAINING[@]}" -gt 0 ]; then
            echo "=== 나머지 세트(${REMAINING[*]}) 8시간 간격 예약 ==="
            node scripts/build-publish-queue.js "$DATE" "${REMAINING[@]}"
            echo "queued=true" >> "$GITHUB_OUTPUT"
          else
            echo "queued=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.publish.outputs.queued == 'true'
        run: |
          DATE="${{ needs.render.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "docs/${DATE}-publish-queue.json"
          git commit -m "게시 대기열 생성: ${DATE}"
          git push origin master
