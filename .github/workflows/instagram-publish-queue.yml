name: Instagram 게시 대기열 처리

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 발행 시각 된 세트 게시 (최초 승인 시점에 이미 승인된 작업 — 추가 승인 불필요)
        id: process
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841429536058936"
        run: |
          node scripts/process-publish-queue.js | tee /tmp/queue_output.txt
          if grep -q "^CHANGED$" /tmp/queue_output.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*-publish-queue.json
          git commit -m "게시 대기열 처리"
          git push origin master
