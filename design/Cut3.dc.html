<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#FFC93C;}
    a:hover{color:#e0ac1f;}
    .frame{
      width:1080px;height:1350px;position:relative;overflow:hidden;z-index:0;
      background:#0a1420;
      font-family:'Noto Sans KR',sans-serif;color:#F5F7FA;
      display:flex;flex-direction:column;align-items:center;text-align:center;
      padding:130px 90px 90px;
    }
    .ghost-num{position:absolute;top:60px;right:20px;font-family:'Black Han Sans',sans-serif;font-size:260px;color:rgba(255,201,60,0.07);line-height:1;z-index:0;}
    .step-label{position:relative;z-index:1;font-size:20px;letter-spacing:5px;color:#FFC93C;font-weight:700;}
    .icon-badge{
      position:relative;z-index:1;
      width:210px;height:210px;border-radius:50%;
      background:#0a1420;border:2px solid rgba(255,201,60,0.55);
      display:flex;align-items:center;justify-content:center;margin-top:40px;flex-shrink:0;
      box-shadow:0 10px 30px rgba(0,0,0,0.45);
    }
    .subtitle{position:relative;z-index:1;font-family:'Black Han Sans',sans-serif;font-size:48px;line-height:1.3;color:#F5F7FA;margin-top:44px;font-weight:400;}
    .body-text{position:relative;z-index:1;font-size:27px;line-height:1.65;color:#93A2B8;margin-top:28px;max-width:820px;}
    .stat{position:relative;z-index:1;margin-top:32px;background:rgba(255,201,60,0.12);border:1px solid rgba(255,201,60,0.4);color:#FFC93C;font-weight:700;font-size:28px;padding:16px 34px;border-radius:50px;}
    .footer-logo{position:absolute;right:70px;bottom:56px;font-size:18px;letter-spacing:2px;color:rgba(255,255,255,0.45);font-weight:700;z-index:1;}
    .page-indicator{position:absolute;left:70px;bottom:56px;font-size:18px;color:rgba(255,255,255,0.35);letter-spacing:2px;z-index:1;}
  </style>
</helmet>
<div class="frame">
  <div class="ghost-num">02</div>
  <div class="step-label">STEP 02</div>
  <div class="icon-badge">
    <svg viewBox="0 0 240 240" width="118" height="118" fill="none">
      <line x1="30" y1="210" x2="210" y2="210" stroke="#FFC93C" stroke-width="6" stroke-linecap="round"/>
      <rect x="50" y="150" width="28" height="60" rx="3" stroke="#FFC93C" stroke-width="7"/>
      <rect x="100" y="110" width="28" height="100" rx="3" stroke="#FFC93C" stroke-width="7"/>
      <rect x="150" y="60" width="28" height="150" rx="3" stroke="#FFC93C" stroke-width="7"/>
      <path d="M55 90 L110 60 L165 40 L195 20" stroke="#FFC93C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M178 18 L198 20 L195 40" stroke="#FFC93C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>
  <h2 class="subtitle">밥상 브랜드가 동시에 오른다</h2>
  <p class="body-text">오뚜기는 카레·당면·케첩·후추 등 29개 품목 출고가를 최대 17% 올렸고, 파리바게뜨는 8월 25일부터 빵류 86종을, 삼립은 9월 1일부터 50여 종을, 뚜레쥬르는 76종을 5~9%대 인상합니다.</p>
  <div class="stat">오뚜기 최대 17% · 삼립 9%대 인상</div>
  <div class="page-indicator">03 / 06</div>
  <div class="footer-logo">@econo.card</div>
</div>
</x-dc>
</body>
</html>
