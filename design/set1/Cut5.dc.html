<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;}
  .frame{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:#F6F1E7;
    font-family:'Noto Sans KR',sans-serif;color:#1A2B45;
  }
  .frame::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#E4DDCE 1.5px,transparent 1.5px);
    background-size:28px 28px;opacity:.5;
  }
  .content{position:relative;z-index:1;padding:64px 64px 0;height:100%;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand-badge{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;border:2px solid #1A2B45;border-radius:40px;
    padding:10px 22px;font-weight:800;font-size:22px;letter-spacing:.5px;
  }
  .brand-badge .dot{width:10px;height:10px;border-radius:50%;background:#E8543E;}
  .tagline{font-size:20px;font-weight:700;color:#7A7368;letter-spacing:.5px;}

  .section-head{display:flex;align-items:center;gap:20px;margin-top:56px;}
  .num-badge{
    width:76px;height:76px;border-radius:50%;background:#1A2B45;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:32px;flex-shrink:0;
  }
  .section-title{font-weight:900;font-size:48px;color:#1A2B45;}
  .section-title span{color:#E8543E;}

  .tip-list{margin-top:40px;display:flex;flex-direction:column;gap:20px;}
  .tip{
    display:flex;gap:22px;align-items:flex-start;
    background:#fff;border-radius:18px;padding:26px 28px;box-shadow:0 6px 0 #E4DDCE;
  }
  .tip .chip{
    flex-shrink:0;width:48px;height:48px;border-radius:12px;background:#F2A93B;
    color:#fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;
  }
  .tip .tip-body{font-size:30px;font-weight:700;line-height:1.45;color:#1A2B45;}
  .tip .tip-body b{color:#E8543E;}

  .main{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .footer{padding-bottom:56px;}
  .bottom-meta{
    display:flex;align-items:center;justify-content:space-between;
    font-size:22px;font-weight:700;color:#9A9283;
  }
  .bottom-meta .handle{color:#1A2B45;}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="topbar">
      <div class="brand-badge"><span class="dot"></span>ECONOMY CARD NEWS</div>
      <div class="tagline">STEP 04 · 대응</div>
    </div>

    <div class="main">
      <div class="section-head">
        <div class="num-badge">04</div>
        <div class="section-title">그래서 <span>어떻게</span> 해야 할까</div>
      </div>

      <div class="tip-list">
        <div class="tip">
          <div class="chip">1</div>
          <div class="tip-body">사우디-후티 휴전 협상이 실제로 타결되는지 <b>이번 주 뉴스</b>를 주목하세요</div>
        </div>
        <div class="tip">
          <div class="chip">2</div>
          <div class="tip-body">국채금리가 다시 5%를 넘으면 <b>증시 조정 압력</b>이 커질 수 있어요</div>
        </div>
        <div class="tip">
          <div class="chip">3</div>
          <div class="tip-body">반도체 쏠림보다 <b>업종 분산</b>으로 변동성에 대비해보세요</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="bottom-meta">
        <span>05 / 06</span>
        <span class="handle">@econo.card</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
