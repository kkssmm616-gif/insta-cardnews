<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;}
  .frame{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:#F6F1E7;
    font-family:'Noto Sans KR',sans-serif;color:#1A2B45;
  }
  .frame::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#E4DDCE 1.5px,transparent 1.5px);
    background-size:28px 28px;opacity:.5;
  }
  .content{position:relative;z-index:1;padding:64px 64px 0;height:100%;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand-badge{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;border:2px solid #1A2B45;border-radius:40px;
    padding:10px 22px;font-weight:800;font-size:22px;letter-spacing:.5px;
  }
  .brand-badge .dot{width:10px;height:10px;border-radius:50%;background:#E8543E;}
  .tagline{font-size:20px;font-weight:700;color:#7A7368;letter-spacing:.5px;}

  .section-head{display:flex;align-items:center;gap:20px;margin-top:56px;}
  .num-badge{
    width:76px;height:76px;border-radius:50%;background:#1A2B45;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:32px;flex-shrink:0;
  }
  .section-title{font-weight:900;font-size:48px;color:#1A2B45;}
  .section-title span{color:#E8543E;}

  .lead{margin-top:34px;font-size:34px;line-height:1.55;font-weight:500;color:#3A362D;}
  .lead b{font-weight:800;color:#1A2B45;}

  .impact-row{margin-top:40px;background:#fff;border-radius:20px;padding:32px 34px;box-shadow:0 6px 0 #E4DDCE;}
  .impact-row+.impact-row{margin-top:20px;}
  .impact-top{display:flex;align-items:center;justify-content:space-between;}
  .impact-label{font-size:26px;font-weight:700;color:#7A7368;}
  .impact-icon{
    width:56px;height:56px;border-radius:50%;background:#F6F1E7;
    display:flex;align-items:center;justify-content:center;font-size:28px;
  }
  .impact-value{margin-top:10px;display:flex;align-items:baseline;gap:14px;}
  .impact-value .before{font-size:32px;font-weight:700;color:#B0A896;text-decoration:line-through;}
  .impact-value .arrow{color:#B0A896;font-size:28px;}
  .impact-value .after{font-size:44px;font-weight:900;color:#E8543E;}

  .main{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .footer{padding-bottom:56px;}
  .bottom-meta{
    display:flex;align-items:center;justify-content:space-between;
    font-size:22px;font-weight:700;color:#9A9283;
  }
  .bottom-meta .handle{color:#1A2B45;}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="topbar">
      <div class="brand-badge"><span class="dot"></span>ECONOMY CARD NEWS</div>
      <div class="tagline">STEP 03 · 영향</div>
    </div>

    <div class="main">
      <div class="section-head">
        <div class="num-badge">03</div>
        <div class="section-title">내 <span>지갑</span>엔 어떤 영향</div>
      </div>

      <p class="lead">
        미국 금리가 오르면 <b>달러가 강해지고</b>, 원/달러 환율이 함께
        뛰면서 해외직구·여행비 부담으로 이어질 수 있어요.
      </p>

      <div class="impact-row">
        <div class="impact-top">
          <div class="impact-label">💳 4억 5,000만원 변동금리 대출</div>
        </div>
        <div class="impact-value">
          <span class="before">월 187만원</span>
          <span class="arrow">→</span>
          <span class="after">월 212만원</span>
        </div>
      </div>

      <div class="impact-row">
        <div class="impact-top">
          <div class="impact-label">✈️ 해외여행 100만원 환전</div>
        </div>
        <div class="impact-value">
          <span class="before">1,320원</span>
          <span class="arrow">→</span>
          <span class="after">1,365원</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="bottom-meta">
        <span>04 / 06</span>
        <span class="handle">@econo.card</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
