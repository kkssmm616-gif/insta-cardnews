<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;}
  .frame{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:#F6F1E7;
    font-family:'Noto Sans KR',sans-serif;color:#1A2B45;
  }
  .frame::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#E4DDCE 1.5px,transparent 1.5px);
    background-size:28px 28px;opacity:.5;
  }
  .content{position:relative;z-index:1;padding:64px 64px 0;height:100%;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand-badge{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;border:2px solid #1A2B45;border-radius:40px;
    padding:10px 22px;font-weight:800;font-size:22px;letter-spacing:.5px;
  }
  .brand-badge .dot{width:10px;height:10px;border-radius:50%;background:#E8543E;}
  .tagline{font-size:20px;font-weight:700;color:#7A7368;letter-spacing:.5px;}

  .section-head{display:flex;align-items:center;gap:20px;margin-top:56px;}
  .num-badge{
    width:76px;height:76px;border-radius:50%;background:#1A2B45;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:32px;flex-shrink:0;
  }
  .section-title{font-weight:900;font-size:48px;color:#1A2B45;}
  .section-title span{color:#E8543E;}

  .lead{margin-top:34px;font-size:34px;line-height:1.55;font-weight:500;color:#3A362D;}
  .lead b{font-weight:800;color:#1A2B45;background:linear-gradient(to top,#FCE1B8 40%,transparent 40%);}

  .cards{margin-top:36px;display:flex;gap:20px;}
  .card{
    flex:1;background:#fff;border-radius:20px;padding:28px 24px;
    box-shadow:0 6px 0 #E4DDCE;text-align:center;
  }
  .card .card-label{font-size:22px;font-weight:700;color:#9A9283;}
  .card .card-value{margin-top:10px;font-size:40px;font-weight:900;color:#1A2B45;}
  .card.hot .card-value{color:#E8543E;}
  .card .card-sub{margin-top:6px;font-size:20px;font-weight:600;color:#B0A896;}

  .photo-card{
    position:relative;margin-top:36px;border-radius:20px;overflow:hidden;
    height:250px;box-shadow:0 6px 0 #E4DDCE;
  }
  .photo-card img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(26,43,69,0) 55%,rgba(26,43,69,.6) 100%);
  }
  .photo-card-tag{
    position:absolute;left:20px;bottom:16px;z-index:2;
    color:#fff;font-size:20px;font-weight:800;letter-spacing:.2px;
    background:rgba(26,43,69,.55);padding:7px 16px;border-radius:20px;
  }

  .mascot-wrap{display:flex;align-items:flex-end;gap:16px;margin-top:32px;}
  .mascot{width:64px;height:64px;flex-shrink:0;}
  .mascot-bubble{
    background:#fff;border:2px solid #1A2B45;border-radius:16px;
    padding:9px 16px;font-size:20px;font-weight:800;color:#1A2B45;
    position:relative;white-space:nowrap;
  }
  .mascot-bubble::before{
    content:"";position:absolute;left:-10px;bottom:14px;
    width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;
    border-right:10px solid #1A2B45;
  }
  .mascot-bubble::after{
    content:"";position:absolute;left:-7px;bottom:14px;
    width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;
    border-right:8px solid #fff;
  }

  .main{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .footer{padding-bottom:56px;}
  .bottom-meta{
    display:flex;align-items:center;justify-content:space-between;
    font-size:22px;font-weight:700;color:#9A9283;
  }
  .bottom-meta .handle{color:#1A2B45;}
</style>
</helmet>

        <b>수출·생산 증가세</b>가 성장을 이끌고 있다고 봤어요.
      </p>
