<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;}
  .frame{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:#F6F1E7;
    font-family:'Noto Sans KR',sans-serif;color:#1A2B45;
  }
  .frame::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#E4DDCE 1.5px,transparent 1.5px);
    background-size:28px 28px;opacity:.5;
  }
  .content{position:relative;z-index:1;padding:64px 64px 0;height:100%;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand-badge{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;border:2px solid #1A2B45;border-radius:40px;
    padding:10px 22px;font-weight:800;font-size:22px;letter-spacing:.5px;
  }
  .brand-badge .dot{width:10px;height:10px;border-radius:50%;background:#E8543E;}
  .tagline{font-size:20px;font-weight:700;color:#7A7368;letter-spacing:.5px;}
  .headline{
    margin-top:56px;font-weight:900;font-size:80px;line-height:1.22;color:#1A2B45;
    letter-spacing:-1px;
  }
  .headline em{font-style:normal;color:#E8543E;}
  .subcopy-box{
    margin-top:24px;background:#fff;border-radius:16px;padding:20px 26px;
    font-size:28px;font-weight:600;color:#4A4438;
    box-shadow:0 6px 0 #E4DDCE;
    display:inline-block;
  }
  .hero-photo{
    position:relative;flex:1;margin:24px 0 4px;border-radius:28px;overflow:hidden;
    box-shadow:0 10px 0 #E4DDCE;
  }
  .hero-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(26,43,69,.05) 0%,rgba(26,43,69,.15) 55%,rgba(26,43,69,.7) 100%);
  }
  .hero-badge{
    position:absolute;right:26px;bottom:26px;z-index:2;
    width:116px;height:116px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 0 rgba(0,0,0,.12);
  }
  .mascot-wrap{display:flex;align-items:flex-end;gap:16px;margin-top:20px;}
  .mascot{width:76px;height:76px;flex-shrink:0;}
  .mascot-bubble{
    background:#fff;border:2px solid #1A2B45;border-radius:16px;
    padding:10px 18px;font-size:22px;font-weight:800;color:#1A2B45;
    position:relative;white-space:nowrap;
  }
  .mascot-bubble::before{
    content:"";position:absolute;left:-10px;bottom:16px;
    width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;
    border-right:10px solid #1A2B45;
  }
  .mascot-bubble::after{
    content:"";position:absolute;left:-7px;bottom:16px;
    width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;
    border-right:8px solid #fff;
  }
  .footer{margin-top:22px;padding-bottom:56px;}
  .bottom-meta{
    margin-top:22px;display:flex;align-items:center;justify-content:space-between;
    font-size:22px;font-weight:700;color:#9A9283;
  }
  .bottom-meta .handle{color:#1A2B45;}
</style>
</helmet>
