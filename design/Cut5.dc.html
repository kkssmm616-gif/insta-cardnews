<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#FFC93C;}
    a:hover{color:#e0ac1f;}
    .frame{
      width:1080px;height:1350px;position:relative;overflow:hidden;z-index:0;
      background:#0a1420;
      font-family:'Noto Sans KR',sans-serif;color:#F5F7FA;
      display:flex;flex-direction:column;
    }
    .photo-band{position:relative;width:100%;height:620px;overflow:hidden;flex-shrink:0;}
    .photo-band img{width:100%;height:100%;object-fit:cover;filter:saturate(1.1) contrast(1.05) brightness(0.9);}
    .photo-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,32,0) 0%,rgba(10,20,32,0.1) 42%,rgba(10,20,32,0.88) 80%,#0a1420 100%);}
    .content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 90px 76px;margin-top:-74px;}
    .ghost-num{position:absolute;top:-14px;right:-6px;font-family:'Black Han Sans',sans-serif;font-size:220px;color:rgba(255,201,60,0.10);line-height:1;z-index:-1;}
    .step-label{font-size:20px;letter-spacing:5px;color:#FFC93C;font-weight:700;}
    .icon-badge{
      width:168px;height:168px;border-radius:50%;
      background:#0a1420;border:2px solid rgba(255,201,60,0.55);
      display:flex;align-items:center;justify-content:center;margin-top:18px;flex-shrink:0;
      box-shadow:0 10px 30px rgba(0,0,0,0.45);
    }
    .subtitle{font-family:'Black Han Sans',sans-serif;font-size:46px;line-height:1.3;color:#F5F7FA;margin-top:32px;font-weight:400;}
    .body-text{font-size:26px;line-height:1.6;color:#93A2B8;margin-top:24px;max-width:820px;}
    .footer-logo{position:absolute;right:70px;bottom:56px;font-size:18px;letter-spacing:2px;color:rgba(255,255,255,0.45);font-weight:700;z-index:1;}
    .page-indicator{position:absolute;left:70px;bottom:56px;font-size:18px;color:rgba(255,255,255,0.35);letter-spacing:2px;z-index:1;}
  </style>
</helmet>
