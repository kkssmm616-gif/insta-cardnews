<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#FFC93C;}
    a:hover{color:#e0ac1f;}
    .frame{
      width:1080px;height:1350px;position:relative;overflow:hidden;z-index:0;
      background:#0a1420;
      font-family:'Noto Sans KR',sans-serif;color:#F5F7FA;
    }
    .skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:640px;z-index:0;}
    .sky-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,32,0.15) 0%,rgba(10,20,32,0.55) 46%,rgba(10,20,32,0.97) 78%,#0a1420 100%);z-index:0;}
    .content{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:100px 90px;}
    .kicker{font-size:22px;letter-spacing:6px;color:#FFC93C;font-weight:700;}
    .badge-tag{
      margin-top:56px;display:inline-flex;align-items:center;gap:10px;
      background:rgba(255,201,60,0.14);border:1px solid rgba(255,201,60,0.45);
      padding:14px 26px;border-radius:40px;font-size:21px;color:#FFC93C;font-weight:700;
    }
    .spacer{flex:1;}
    .headline{
      font-family:'Black Han Sans',sans-serif;font-size:60px;line-height:1.28;
      color:#F5F7FA;margin:0;font-weight:400;text-shadow:0 6px 26px rgba(0,0,0,0.55);
    }
    .subcopy{font-size:28px;font-weight:700;color:#FFC93C;margin-top:22px;}
    .swipe{display:flex;align-items:center;gap:14px;font-size:22px;letter-spacing:2px;color:#c9d3e0;padding-bottom:10px;}
    .footer-logo{position:absolute;right:70px;bottom:56px;font-size:18px;letter-spacing:2px;color:rgba(255,255,255,0.45);font-weight:700;z-index:1;}
    .page-indicator{position:absolute;left:70px;bottom:56px;font-size:18px;color:rgba(255,255,255,0.35);letter-spacing:2px;z-index:1;}
  </style>
</helmet>
<div class="frame">
  <svg class="skyline" viewBox="0 0 1080 700" preserveAspectRatio="none">
    <rect x="-20" y="430" width="130" height="270" fill="#0f1c30"/>
    <rect x="100" y="360" width="90" height="340" fill="#132339"/>
    <rect x="185" y="470" width="110" height="230" fill="#0f1c30"/>
    <rect x="290" y="300" width="100" height="400" fill="#16283f"/>
    <rect x="385" y="410" width="80" height="290" fill="#0f1c30"/>
    <rect x="460" y="250" width="120" height="450" fill="#182b45"/>
    <rect x="575" y="380" width="90" height="320" fill="#132339"/>
    <rect x="660" y="440" width="110" height="260" fill="#0f1c30"/>
    <rect x="765" y="290" width="100" height="410" fill="#16283f"/>
    <rect x="860" y="400" width="90" height="300" fill="#132339"/>
    <rect x="945" y="460" width="135" height="240" fill="#0f1c30"/>
    <g fill="#FFC93C" opacity="0.5">
      <rect x="120" y="390" width="10" height="14"/><rect x="145" y="390" width="10" height="14"/><rect x="120" y="430" width="10" height="14"/><rect x="145" y="430" width="10" height="14"/>
      <rect x="305" y="330" width="10" height="14"/><rect x="330" y="330" width="10" height="14"/><rect x="360" y="330" width="10" height="14"/><rect x="305" y="370" width="10" height="14"/><rect x="330" y="370" width="10" height="14"/>
      <rect x="480" y="280" width="10" height="14"/><rect x="505" y="280" width="10" height="14"/><rect x="530" y="280" width="10" height="14"/><rect x="480" y="320" width="10" height="14"/><rect x="530" y="320" width="10" height="14"/>
      <rect x="785" y="320" width="10" height="14"/><rect x="810" y="320" width="10" height="14"/><rect x="785" y="360" width="10" height="14"/><rect x="835" y="360" width="10" height="14"/>
    </g>
  </svg>
  <div class="sky-overlay"></div>
  <div class="content">
    <div class="kicker">ECONOMY CARD NEWS</div>
    <div class="badge-tag">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9H21L15.5 13L17.5 21L12 16.5L6.5 21L8.5 13L3 9H9.5L12 2Z" stroke="#FFC93C" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>밥상 물가 리포트</span>
    </div>
    <div class="spacer"></div>
    <h1 class="headline">추석 앞두고,<br/>밥상 물가가 들썩인다</h1>
    <p class="subcopy">오뚜기·파리바게뜨·삼립까지 줄줄이 가격 인상</p>
    <div class="spacer"></div>
    <div class="swipe">
      <span>무슨 일인지 알아보기</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 12H20M20 12L14 6M20 12L14 18" stroke="#FFC93C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>swipe</span>
    </div>
  </div>
  <div class="page-indicator">01 / 06</div>
  <div class="footer-logo">@econo.card</div>
</div>
</x-dc>
</body>
</html>
