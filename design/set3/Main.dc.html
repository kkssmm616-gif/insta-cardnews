<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;}
  .frame{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:#F6F1E7;
    font-family:'Noto Sans KR',sans-serif;color:#1A2B45;
  }
  .frame::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#E4DDCE 1.5px,transparent 1.5px);
    background-size:28px 28px;opacity:.5;
  }
  .content{position:relative;z-index:1;padding:64px 64px 0;height:100%;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand-badge{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;border:2px solid #1A2B45;border-radius:40px;
    padding:10px 22px;font-weight:800;font-size:22px;letter-spacing:.5px;
  }
  .brand-badge .dot{width:10px;height:10px;border-radius:50%;background:#E8543E;}
  .tagline{font-size:20px;font-weight:700;color:#7A7368;letter-spacing:.5px;}
  .headline{
    margin-top:70px;font-weight:900;font-size:88px;line-height:1.22;color:#1A2B45;
    letter-spacing:-1px;
  }
  .headline em{font-style:normal;color:#E8543E;}
  .subcopy-box{
    margin-top:28px;background:#fff;border-radius:16px;padding:22px 28px;
    font-size:30px;font-weight:600;color:#4A4438;
    box-shadow:0 6px 0 #E4DDCE;
    display:inline-block;
  }
  .illustration{
    flex:1;display:flex;align-items:center;justify-content:center;margin:20px 0;
  }
  .footer{margin-top:auto;padding-bottom:56px;}
  .swipe-row{display:flex;align-items:center;gap:14px;color:#7A7368;font-size:24px;font-weight:700;}
  .bottom-meta{
    margin-top:26px;display:flex;align-items:center;justify-content:space-between;
    font-size:22px;font-weight:700;color:#9A9283;
  }
  .bottom-meta .handle{color:#1A2B45;}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="topbar">
      <div class="brand-badge"><span class="dot"></span>ECONOMY CARD NEWS</div>
      <div class="tagline">MONEY BETTER LIFE</div>
    </div>

    <h1 class="headline">내년 시급,<br/><em>10,700원</em>으로</h1>
    <div class="subcopy-box">2027년 최저임금 확정, 올해보다 3.7% 인상</div>

    <div class="illustration">
      <svg width="420" height="420" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="96" fill="#fff" stroke="#E4DDCE" stroke-width="2"/>
        <rect x="62" y="100" width="30" height="50" rx="4" fill="#E4DDCE"/>
        <rect x="108" y="72" width="30" height="78" rx="4" fill="#E8543E"/>
        <text x="77" y="90" text-anchor="middle" font-family="Noto Sans KR" font-weight="800" font-size="16" fill="#9A9283">2026</text>
        <text x="123" y="62" text-anchor="middle" font-family="Noto Sans KR" font-weight="800" font-size="16" fill="#E8543E">2027</text>
        <text x="100" y="172" text-anchor="middle" font-family="Noto Sans KR" font-weight="900" font-size="22" fill="#1A2B45">10,320원 → 10,700원</text>
      </svg>
    </div>

    <div class="footer">
      <div class="swipe-row">무슨 일인지 알아보기 → swipe</div>
      <div class="bottom-meta">
        <span>01 / 06</span>
        <span class="handle">@econo.card</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
