<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#FFC93C;}
    a:hover{color:#e0ac1f;}
    .frame{
      width:1080px;height:1350px;position:relative;overflow:hidden;z-index:0;
      background:#0a1420;
      font-family:'Noto Sans KR',sans-serif;color:#F5F7FA;
    }
    .bg-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
    .sky-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,32,0.35) 0%,rgba(10,20,32,0.6) 40%,rgba(10,20,32,0.97) 78%,#0a1420 100%);z-index:0;}
    .content{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:100px 90px;}
    .kicker{font-size:22px;letter-spacing:6px;color:#FFC93C;font-weight:700;}
    .badge-tag{
      margin-top:56px;display:inline-flex;align-items:center;gap:10px;
      background:rgba(255,201,60,0.14);border:1px solid rgba(255,201,60,0.45);
      padding:14px 26px;border-radius:40px;font-size:21px;color:#FFC93C;font-weight:700;
    }
    .spacer{flex:1;}
    .headline{
      font-family:'Black Han Sans',sans-serif;font-size:58px;line-height:1.28;
      color:#F5F7FA;margin:0;font-weight:400;text-shadow:0 6px 26px rgba(0,0,0,0.55);
    }
    .subcopy{font-size:26px;font-weight:700;color:#FFC93C;margin-top:22px;}
    .swipe{display:flex;align-items:center;gap:14px;font-size:22px;letter-spacing:2px;color:#c9d3e0;padding-bottom:10px;}
    .footer-logo{position:absolute;right:70px;bottom:56px;font-size:18px;letter-spacing:2px;color:rgba(255,255,255,0.45);font-weight:700;z-index:1;}
    .page-indicator{position:absolute;left:70px;bottom:56px;font-size:18px;color:rgba(255,255,255,0.35);letter-spacing:2px;z-index:1;}
</style>
</helmet>
