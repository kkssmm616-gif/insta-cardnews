  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;}
  .frame{

  .section-head{display:flex;align-items:center;gap:20px;margin-top:56px;}

  .card .card-label{font-size:22px;font-weight:700;color:#9A9283;}

  .card.hot .card-value{color:#E8543E;}
  .card .card-sub{margin-top:6px;font-size:20px;font-weight:600;color:#B0A896;}

  .photo-card{
    position:relative;margin-top:36px;border-radius:20px;overflow:hidden;
    height:250px;box-shadow:0 6px 0 #E4DDCE;
  }
  .photo-card img{width:100%;height:100%;object-fit:cover;display:block;}

    content:"";position:absolute;inset:0;

  .photo-card-tag{
    position:absolute;left:20px;bottom:16px;z-index:2;
    color:#fff;font-size:20px;font-weight:800;letter-spacing:.2px;
    background:rgba(26,43,69,.55);padding:7px 16px;border-radius:20px;
  }

  .mascot{width:64px;height:64px;flex-shrink:0;}
  .mascot-bubble{
    background:#fff;border:2px solid #1A2B45;border-radius:16px;
    padding:9px 16px;font-size:20px;font-weight:800;color:#1A2B45;
    position:relative;white-space:nowrap;
  }
  .mascot-bubble::before{
    content:"";position:absolute;left:-10px;bottom:14px;
    width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;
    border-right:10px solid #1A2B45;
  }
  .mascot-bubble::after{
    content:"";position:absolute;left:-7px;bottom:14px;
    width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;
    border-right:8px solid #fff;
  }

  .main{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .footer{padding-bottom:56px;}
  .bottom-meta{

    font-size:22px;font-weight:700;color:#9A9283;
  }
  .bottom-meta .handle{color:#1A2B45;}
