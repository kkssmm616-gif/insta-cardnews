<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;}
  .frame{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:#F6F1E7;
    font-family:'Noto Sans KR',sans-serif;color:#1A2B45;
  }
  .frame::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#E4DDCE 1.5px,transparent 1.5px);
    background-size:28px 28px;opacity:.5;
  }
  .content{position:relative;z-index:1;padding:64px 64px 0;height:100%;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand-badge{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;border:2px solid #1A2B45;border-radius:40px;
    padding:10px 22px;font-weight:800;font-size:22px;letter-spacing:.5px;
  }
  .brand-badge .dot{width:10px;height:10px;border-radius:50%;background:#E8543E;}
  .tagline{font-size:20px;font-weight:700;color:#7A7368;letter-spacing:.5px;}

  .main{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .recap-title{font-size:44px;font-weight:900;line-height:1.4;color:#1A2B45;}
  .recap-title span{color:#E8543E;}

  .callout{
    margin-top:40px;background:#1A2B45;border-radius:24px;padding:44px 40px;
    text-align:center;
  }
  .callout p{font-size:36px;font-weight:800;line-height:1.5;color:#fff;}
  .callout p b{color:#F2A93B;}

  .cta{
    margin-top:34px;display:flex;align-items:center;justify-content:center;gap:14px;
    background:#fff;border:2px dashed #1A2B45;border-radius:18px;padding:26px;
  }
  .cta .icon{font-size:32px;}
  .cta .txt{font-size:28px;font-weight:800;color:#1A2B45;}

  .mascot-wrap{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:36px;}
  .mascot{width:92px;height:92px;flex-shrink:0;}
  .mascot-bubble{
    background:#fff;border:2px solid #1A2B45;border-radius:16px;
    padding:10px 18px;font-size:22px;font-weight:800;color:#1A2B45;
    position:relative;white-space:nowrap;
  }
  .mascot-bubble::before{
    content:"";position:absolute;left:-10px;bottom:16px;
    width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;
    border-right:10px solid #1A2B45;
  }
  .mascot-bubble::after{
    content:"";position:absolute;left:-7px;bottom:16px;
    width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;
    border-right:8px solid #fff;
  }

  .sign-off{margin-top:auto;padding-bottom:56px;text-align:center;}
  .sign-off .line1{font-size:24px;font-weight:700;color:#9A9283;}
  .sign-off .line2{margin-top:6px;font-size:22px;font-weight:900;letter-spacing:2px;color:#1A2B45;}
  .bottom-meta{
    margin-top:26px;display:flex;align-items:center;justify-content:space-between;
    font-size:22px;font-weight:700;color:#9A9283;
  }
  .bottom-meta .handle{color:#1A2B45;}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="topbar">
      <div class="brand-badge"><span class="dot"></span>ECONOMY CARD NEWS</div>
      <div class="tagline">SUMMARY</div>
    </div>

    <div class="main">
      <div class="recap-title">거래는 얼어붙었지만,<br/><span>가격은 식지 않았다</span></div>

      <div class="callout">
        <p>8월 거래량 3,046건, 4개월 연속 감소인데<br/>아파트값은 오히려 <b>상승 폭이 커졌어요</b></p>
      </div>

      <div class="cta">
        <span class="icon">🔖</span>
        <span class="txt">저장해두고 매수 타이밍 고민할 때 다시 보기</span>
      </div>

      <div class="mascot-wrap">
        <svg class="mascot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="68" rx="44" ry="46" fill="#1A2B45"/>
          <path d="M22 40 L12 14 L38 30 Z" fill="#1A2B45"/>
          <path d="M98 40 L108 14 L82 30 Z" fill="#1A2B45"/>
          <ellipse cx="60" cy="76" rx="27" ry="31" fill="#F6F1E7"/>
          <circle cx="42" cy="58" r="17" fill="#fff"/>
          <circle cx="78" cy="58" r="17" fill="#fff"/>
          <circle cx="44" cy="60" r="7.5" fill="#1A2B45"/>
          <circle cx="76" cy="60" r="7.5" fill="#1A2B45"/>
          <circle cx="47" cy="57" r="2.2" fill="#fff"/>
          <circle cx="79" cy="57" r="2.2" fill="#fff"/>
          <path d="M54 70 L66 70 L60 80 Z" fill="#F2A93B"/>
          <path d="M92 50 Q108 40 104 62 Q96 58 92 50 Z" fill="#1A2B45"/>
          <path d="M46 108 L42 118 M60 110 L60 120 M74 108 L78 118" stroke="#F2A93B" stroke-width="5" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="mascot-bubble">내일도 같이 봐요! 👋</div>
      </div>
    </div>

    <div class="sign-off">
      <div class="line1">오늘의 작은 확인이, 내일의 손실을 아낍니다</div>
      <div class="line2">ECONOMY CARD NEWS</div>
      <div class="bottom-meta">
        <span>06 / 06</span>
        <span class="handle">@econo.card</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
