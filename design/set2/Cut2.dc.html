<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:#FFC93C;}
    a:hover{color:#e0ac1f;}
    .frame{
      width:1080px;height:1350px;position:relative;overflow:hidden;z-index:0;
      background:#0a1420;
      font-family:'Noto Sans KR',sans-serif;color:#F5F7FA;
      display:flex;flex-direction:column;align-items:center;text-align:center;
    }
    .photo-band{position:relative;width:100%;height:560px;overflow:hidden;flex-shrink:0;}
    .photo-band img{width:100%;height:100%;object-fit:cover;display:block;}
    .photo-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,32,0.05) 30%,#0a1420 94%);}
    .body-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;padding:0 90px 80px;margin-top:-46px;flex:1;}
    .step-label{position:relative;z-index:1;font-size:20px;letter-spacing:5px;color:#FFC93C;font-weight:700;}
    .icon-badge{
      position:relative;z-index:1;
      width:172px;height:172px;border-radius:50%;
      background:#0a1420;border:2px solid rgba(255,201,60,0.55);
      display:flex;align-items:center;justify-content:center;margin-top:20px;flex-shrink:0;
      box-shadow:0 10px 30px rgba(0,0,0,0.45);
    }
    .subtitle{position:relative;z-index:1;font-family:'Black Han Sans',sans-serif;font-size:46px;line-height:1.3;color:#F5F7FA;margin-top:34px;font-weight:400;}
    .body-text{position:relative;z-index:1;font-size:26px;line-height:1.62;color:#93A2B8;margin-top:26px;max-width:820px;}
    .stat{position:relative;z-index:1;margin-top:26px;background:rgba(255,201,60,0.12);border:1px solid rgba(255,201,60,0.4);color:#FFC93C;font-weight:700;font-size:26px;padding:14px 30px;border-radius:50px;}
    .footer-logo{position:absolute;right:70px;bottom:56px;font-size:18px;letter-spacing:2px;color:rgba(255,255,255,0.45);font-weight:700;z-index:1;}
    .page-indicator{position:absolute;left:70px;bottom:56px;font-size:18px;color:rgba(255,255,255,0.35);letter-spacing:2px;z-index:1;}
</style>
</helmet>

    <h2 class="subtitle">기준금리 오르니<br/>은행들도 예금 경쟁</h2>
    <p class="body-text">한국은행이 두 달 연속 기준금리를 올려 3.00%가 되면서 시장금리가 함께 뛰었습니다. 은행들은 조달 비용이 늘자 고객을 붙잡기 위해 예금금리를 앞다퉈 올렸고, 우리은행은 1년 정기예금 금리를 3.1%에서 3.6%로 올렸습니다.</p>
