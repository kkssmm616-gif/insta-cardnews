<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1350px;}
  .frame{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:#F6F1E7;
    font-family:'Noto Sans KR',sans-serif;color:#1A2B45;
  }
  .frame::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle,#E4DDCE 1.5px,transparent 1.5px);
    background-size:28px 28px;opacity:.5;
  }
  .content{position:relative;z-index:1;padding:64px 64px 0;height:100%;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .brand-badge{
    display:inline-flex;align-items:center;gap:10px;
    background:#fff;border:2px solid #1A2B45;border-radius:40px;
    padding:10px 22px;font-weight:800;font-size:22px;letter-spacing:.5px;
  }
  .brand-badge .dot{width:10px;height:10px;border-radius:50%;background:#E8543E;}
  .tagline{font-size:20px;font-weight:700;color:#7A7368;letter-spacing:.5px;}

  .section-head{display:flex;align-items:center;gap:20px;margin-top:56px;}
  .num-badge{
    width:76px;height:76px;border-radius:50%;background:#1A2B45;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:32px;flex-shrink:0;
  }
  .section-title{font-weight:900;font-size:48px;color:#1A2B45;}
  .section-title span{color:#E8543E;}

  .big-stat{
    margin-top:40px;background:#1A2B45;border-radius:24px;padding:40px 44px;
    display:flex;align-items:baseline;gap:16px;
  }
  .big-stat .num{font-size:96px;font-weight:900;color:#fff;letter-spacing:-2px;}
  .big-stat .unit{font-size:34px;font-weight:800;color:#F2A93B;}
  .big-stat-cap{margin-top:14px;font-size:26px;font-weight:600;color:#9A9283;}

  table{margin-top:36px;width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 0 #E4DDCE;}
  thead th{background:#EFE8D8;font-size:24px;font-weight:800;color:#7A7368;padding:18px 20px;text-align:left;}
  tbody td{font-size:26px;font-weight:700;padding:18px 20px;border-top:1px solid #EFE8D8;}
  tbody td.hl{color:#E8543E;font-weight:900;}

  .mascot-wrap{display:flex;align-items:flex-end;gap:16px;margin-top:32px;}
  .mascot{width:64px;height:64px;flex-shrink:0;}
  .mascot-bubble{
    background:#fff;border:2px solid #1A2B45;border-radius:16px;
    padding:9px 16px;font-size:20px;font-weight:800;color:#1A2B45;
    position:relative;white-space:nowrap;
  }
  .mascot-bubble::before{
    content:"";position:absolute;left:-10px;bottom:14px;
    width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;
    border-right:10px solid #1A2B45;
  }
  .mascot-bubble::after{
    content:"";position:absolute;left:-7px;bottom:14px;
    width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;
    border-right:8px solid #fff;
  }

  .main{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .footer{padding-bottom:56px;}
  .bottom-meta{
    display:flex;align-items:center;justify-content:space-between;
    font-size:22px;font-weight:700;color:#9A9283;
  }
  .bottom-meta .handle{color:#1A2B45;}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="topbar">
      <div class="brand-badge"><span class="dot"></span>ECONOMY CARD NEWS</div>
      <div class="tagline">STEP 02 · 현황</div>
    </div>

    <div class="main">
      <div class="section-head">
        <div class="num-badge">02</div>
        <div class="section-title">숫자로 보는 <span>칩플레이션</span></div>
      </div>

      <div class="big-stat">
        <span class="num">+15%</span><span class="unit">올해 전세계 스마트폰 평균 판매가</span>
      </div>
      <div class="big-stat-cap">출시 모델 10개 중 4개 이상이 가격 인상</div>

      <table>
        <thead><tr><th>항목</th><th>가격</th><th>비고</th></tr></thead>
        <tbody>
          <tr><td>아이폰18 프로/프로맥스</td><td class="hl">+100달러</td><td>전작比(국내 약 20만원)</td></tr>
          <tr><td>아이폰 듀오 2TB(폴더블)</td><td class="hl">509만원</td><td>최초 500만원 돌파</td></tr>
          <tr><td>부품 조합가(D램+낸드)</td><td class="hl">132달러</td><td>작년 3분기 35달러</td></tr>
        </tbody>
      </table>

      <div class="mascot-wrap">
        <svg class="mascot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="68" rx="44" ry="46" fill="#1A2B45"/>
          <path d="M22 40 L12 14 L38 30 Z" fill="#1A2B45"/>
          <path d="M98 40 L108 14 L82 30 Z" fill="#1A2B45"/>
          <ellipse cx="60" cy="76" rx="27" ry="31" fill="#F6F1E7"/>
          <circle cx="42" cy="58" r="17" fill="#fff"/>
          <circle cx="78" cy="58" r="17" fill="#fff"/>
          <circle cx="44" cy="60" r="7.5" fill="#1A2B45"/>
          <circle cx="76" cy="60" r="7.5" fill="#1A2B45"/>
          <circle cx="47" cy="57" r="2.2" fill="#fff"/>
          <circle cx="79" cy="57" r="2.2" fill="#fff"/>
          <path d="M54 70 L66 70 L60 80 Z" fill="#F2A93B"/>
          <path d="M16 74 Q6 96 24 110 Q28 92 32 80 Z" fill="#1A2B45"/>
          <path d="M46 108 L42 118 M60 110 L60 120 M74 108 L78 118" stroke="#F2A93B" stroke-width="5" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="mascot-bubble">500만원 폰, 처음이에요</div>
      </div>
    </div>

    <div class="footer">
      <div class="bottom-meta">
        <span>03 / 06</span>
        <span class="handle">@econo.card</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
